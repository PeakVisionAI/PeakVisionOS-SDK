name: AgentOS SDK CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade build
      - run: PYTHONPATH=python python3 -m py_compile python/agentos/*.py
      - run: PYTHONPATH=python python3 tests/test-sdk-http.py
      - run: python -m build python

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript
