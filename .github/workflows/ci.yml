name: AgentOS SDK CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build
      - run: PYTHONPATH=python python3 -m py_compile python/pvos/*.py python/agentos/*.py
      - run: PYTHONPATH=python python3 tests/test-sdk-http.py
      - run: PYTHONPATH=python python3 tests/test-local-client.py
      - run: PYTHONPATH=python python3 tests/test-pvos-toolchain.py
      - run: PYTHONPATH=python python3 tests/test-harness.py
      - run: python -m build python

  typescript:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript
