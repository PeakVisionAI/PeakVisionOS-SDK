name: Release PeakVisionOS VS Code Extension

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package
        working-directory: vscode
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PeakVisionOS VS Code Tools ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: vscode/*.vsix
