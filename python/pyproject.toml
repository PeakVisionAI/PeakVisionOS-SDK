[build-system]
# Setuptools 76+ dropped Python 3.8 support. Select the last compatible line
# only on Python 3.8 and keep current setuptools on newer interpreters.
requires = [
    "setuptools>=61,<76; python_version < '3.9'",
    "setuptools>=77; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "peakvisionos-sdk"
version = "1.5.0a1"
description = "PeakVisionOS Python SDK for local primitives, managed Agents, Harness adapters and the remote Gateway"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "PeakVisionAI" }]
keywords = ["agent", "peakvisionos", "pvos", "agentos", "harness", "edge-ai"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.urls]
Homepage = "https://github.com/PeakVisionAI/PeakVisionOS-SDK"
Documentation = "https://github.com/PeakVisionAI/PeakVisionOS-SDK/tree/main/docs"
Repository = "https://github.com/PeakVisionAI/PeakVisionOS-SDK"

[project.scripts]
pvos = "pvos.cli:main"
agentos = "pvos.cli:legacy_main"

[tool.setuptools]
packages = ["pvos", "agentos"]

[tool.setuptools.package-data]
pvos = ["py.typed"]
agentos = ["py.typed"]
