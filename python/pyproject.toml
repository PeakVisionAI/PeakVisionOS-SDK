[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peakvisionos-sdk"
version = "1.5.0a1"
description = "PeakVisionOS Python SDK for local primitives, managed Agents, Harness adapters and the remote Gateway"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PeakVisionAI" }]
keywords = ["agent", "peakvisionos", "pvos", "agentos", "harness", "edge-ai"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.urls]
Homepage = "https://github.com/PeakVisionAI/AgentOS-SDK"
Documentation = "https://github.com/PeakVisionAI/AgentOS-SDK/tree/main/docs"
Repository = "https://github.com/PeakVisionAI/AgentOS-SDK"

[project.scripts]
pvos = "pvos.cli:main"
agentos = "pvos.cli:legacy_main"

[tool.setuptools]
packages = ["pvos", "agentos"]

[tool.setuptools.package-data]
pvos = ["py.typed"]
agentos = ["py.typed"]
